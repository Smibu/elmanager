<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>SLE</title>
    <base href="/" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }

        #out {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #splash {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #e0e0e0;
            font-family: sans-serif;
            font-size: 1.4rem;
        }

        .spinner {
            width: 1.4rem;
            height: 1.4rem;
            border: 3px solid rgba(224, 224, 224, 0.2);
            border-top-color: #e0e0e0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="out">
        <div id="splash">
            <div class="spinner"></div>
            <span>Loading SLE</span>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>

</html>
